name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/amd64 — primary platform, test both supported Go minors
          - os: ubuntu-latest
            go: '1.25'
          - os: ubuntu-latest
            go: '1.26'
          # linux/arm64 — public free runner
          - os: ubuntu-24.04-arm
            go: '1.26'
          # darwin/arm64 — macos-latest is arm64 since macos-14
          - os: macos-latest
            go: '1.26'
          # windows/amd64
          - os: windows-latest
            go: '1.26'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=3 -run=^$ ./... | tee bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...
